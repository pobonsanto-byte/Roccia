{% extends "base.html" %}

{% block title %}Admin - Meu Bot{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-2 col-md-3 mb-4">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-crown"></i> Admin
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <a href="{{ url_for('admin_dashboard') }}" class="list-group-item bg-dark text-light border-secondary {% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
                            <i class="fas fa-chart-pie"></i> Dashboard
                        </a>
                        <a href="{{ url_for('admin_servicos') }}" class="list-group-item bg-dark text-light border-secondary {% if request.endpoint == 'admin_servicos' %}active{% endif %}">
                            <i class="fas fa-store"></i> Serviços
                        </a>
                        <a href="{{ url_for('admin_categorias') }}" class="list-group-item bg-dark text-light border-secondary {% if request.endpoint == 'admin_categorias' %}active{% endif %}">
                            <i class="fas fa-tags"></i> Categorias
                        </a>
                        <a href="{{ url_for('admin_pedidos') }}" class="list-group-item bg-dark text-light border-secondary {% if request.endpoint == 'admin_pedidos' %}active{% endif %}">
                            <i class="fas fa-box"></i> Pedidos
                        </a>
                        <a href="{{ url_for('admin_clientes') }}" class="list-group-item bg-dark text-light border-secondary {% if request.endpoint == 'admin_clientes' %}active{% endif %}">
                            <i class="fas fa-users"></i> Clientes
                        </a>
                        <a href="{{ url_for('admin_pontos') }}" class="list-group-item bg-dark text-light border-secondary {% if request.endpoint == 'admin_pontos' %}active{% endif %}">
                            <i class="fas fa-star"></i> Pontos
                        </a>
                        <a href="{{ url_for('admin_cupons') }}" class="list-group-item bg-dark text-light border-secondary {% if request.endpoint == 'admin_cupons' %}active{% endif %}">
                            <i class="fas fa-ticket-alt"></i> Cupons
                        </a>
                        <a href="{{ url_for('admin_configuracoes') }}" class="list-group-item bg-dark text-light border-secondary {% if request.endpoint == 'admin_configuracoes' %}active{% endif %}">
                            <i class="fas fa-cog"></i> Configurações
                        </a>
                        <a href="{{ url_for('admin_logs') }}" class="list-group-item bg-dark text-light border-secondary {% if request.endpoint == 'admin_logs' %}active{% endif %}">
                            <i class="fas fa-history"></i> Logs
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Content -->
        <div class="col-lg-10 col-md-9">
            {% block admin_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
